 id="tv-container" class="player-container"></div><div class="controls"><button onclick="loadTvShow(1399,1,1)">Game of Thrones S01E01</button> <button onclick="loadTvShow(1396,1,1)">Breaking Bad S01E01</button> <button onclick='clearContainer("tv-container")'>Rimuovi Player</button></div></div><div class="container"><h2>📊 Eventi Player</h2><div id="events-log" class="events-log">Log eventi del player apparirà qui...</div><button onclick="clearLog()">Pulisci Log</button></div><div class="container"><h2>📁 Catalogo</h2><div class="controls"><button onclick='loadCatalog("movie")'>Carica Catalogo Film</button> <button onclick='loadCatalog("tv")'>Carica Catalogo Serie TV</button> <button onclick="clearCatalog()">Pulisci Catalogo</button></div><div id="catalog-list"></div></div><script src="dist/index.js"></script><script>let vixClient;function setupEventListeners(){vixClient&&(vixClient.addEventListener("play",e=>{logEvent(`▶️ Video avviato - ID: ${e.data.video_id}, Durata: ${Math.floor(e.data.duration)}s`)}),vixClient.addEventListener("pause",e=>{logEvent(`⏸️ Video in pausa - Tempo: ${Math.floor(e.data.currentTime)}s`)}),vixClient.addEventListener("ended",e=>{logEvent("🏁 Video terminato - ID: "+e.data.video_id)}),vixClient.addEventListener("seeked",e=>{logEvent(`⏩ Seek a: ${Math.floor(e.data.currentTime)}s`)}))}function loadMovie(e){if(vixClient){clearContainer("movie-container");try{const t={tmdbId:e,primaryColor:"B20710",secondaryColor:"170000",autoplay:!1,lang:"it"};vixClient.embed(t,{container:"#movie-container",width:"100%",height:"500px"}),logEvent("🎬 Film caricato - TMDB ID: "+e)}catch(e){logEvent("❌ Errore nel caricamento del film: "+e.message)}}else logEvent("❌ Client non inizializzato")}function loadTvShow(e,t,n){if(vixClient){clearContainer("tv-container");try{const i={tmdbId:e,season:t,episode:n,primaryColor:"B20710",secondaryColor:"170000",autoplay:!1,lang:"it"};vixClient.embed(i,{container:"#tv-container",width:"100%",height:"500px"}),logEvent(`📺 Serie TV caricata - TMDB ID: ${e}, S${t}E${n}`)}catch(e){logEvent("❌ Errore nel caricamento della serie: "+e.message)}}else logEvent("❌ Client non inizializzato")}async function loadCatalog(e){if(vixClient){logEvent(`📁 Caricamento catalogo ${e}...`);try{const t=await vixClient.fetchCatalog(e,"it");displayCatalog(t.results),logEvent(`✅ Catalogo ${e} caricato - ${t.results.length} elementi`)}catch(e){logEvent("❌ Errore nel caricamento del catalogo: "+e.message)}}else logEvent("❌ Client non inizializzato")}function displayCatalog(e){const t=document.getElementById("catalog-list");t.innerHTML="",e.slice(0,12).forEach(e=>{const n=document.createElement("div");n.className="catalog-item",n.innerHTML=`\n                    <h4>${e.title}</h4>\n                    <p><strong>ID:</strong> ${e.id}</p>\n                    <p><strong>Tipo:</strong> ${e.type}</p>\n                    ${e.year?`<p><strong>Anno:</strong> ${e.year}</p>`:""}\n                `,t.appendChild(n)})}function clearContainer(e){const t=document.getElementById(e);t&&(t.innerHTML="",logEvent(`🗑️ Container ${e} pulito`))}function clearCatalog(){document.getElementById("catalog-list").innerHTML="",logEvent("🗑️ Catalogo pulito")}function logEvent(e){const t=document.getElementById("events-log"),n=`[${(new Date).toLocaleTimeString()}] ${e}\n`;t.textContent+=n,t.scrollTop=t.scrollHeight}function clearLog(){document.getElementById("events-log").textContent="Log eventi del player apparirà qui...\n"}document.addEventListener("DOMContentLoaded",(function(){"undefined"!=typeof VixSrcClient?(vixClient=new VixSrcClient,setupEventListeners(),logEvent("VixSrc Client inizializzato!")):logEvent("ERRORE: VixSrcClient non trovato. Assicurati che il TypeScript sia compilato.")}))</script><script>!function(e){function t(t){for(var n,i,l=t[0],a=t[1],f=t[2],p=0,s=[];p<l.length;p++)i=l[p],Object.prototype.hasOwnProperty.call(o,i)&&o[i]&&s.push(o[i][0]),o[i]=0;for(n in a)Object.prototype.hasOwnProperty.call(a,n)&&(e[n]=a[n]);for(c&&c(t);s.l
